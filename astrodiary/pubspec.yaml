name: astrodiary
description: "AstroDiary is a night-sky observation planner and logbook."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.10.0
  csv: ^8.0.0
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite_common_ffi: ^2.4.3
  table_calendar: ^3.3.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
